AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'spec/fixtures/**/*'

# Relax rules for legacy code
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'rack_dav.gemspec'

Metrics/MethodLength:
  Max: 30

Metrics/AbcSize:
  Max: 50

Metrics/ClassLength:
  Max: 500

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/BlockNesting:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/StringLiteralsInInterpolation:
  Enabled: false

# Allow monkey patching in specs
Style/ClassAndModuleChildren:
  Exclude:
    - 'spec/**/*'

Gemspec/RequireMFA:
  Enabled: false

Gemspec/DevelopmentDependencies:
  Enabled: false

Gemspec/OrderedDependencies:
  Enabled: false

# Disabled for legacy code compatibility
Style/For:
  Enabled: false

Style/Not:
  Enabled: false

Style/AndOr:
  Enabled: false

Style/NegatedIf:
  Enabled: false

Style/NegatedIfElseCondition:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/Next:
  Enabled: false

Style/RescueStandardError:
  Enabled: false

Style/SpecialGlobalVars:
  Enabled: false

Style/PerlBackrefs:
  Enabled: false

Style/RedundantReturn:
  Enabled: false

Style/HashSyntax:
  Enabled: false

Style/ExplicitBlockArgument:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Style/ZeroLengthPredicate:
  Enabled: false

Style/SignalException:
  Enabled: false

Style/RaiseArgs:
  Enabled: false

Style/InverseMethods:
  Enabled: false

Style/RegexpLiteral:
  Enabled: false

Style/RedundantRegexpArgument:
  Enabled: false

Style/StringConcatenation:
  Enabled: false

Style/PercentLiteralDelimiters:
  Enabled: false

Style/ExpandPathArguments:
  Enabled: false

Style/ClassVars:
  Enabled: false

Style/Alias:
  Enabled: false

Style/MutableConstant:
  Enabled: false

Style/ConditionalAssignment:
  Enabled: false

Style/UnlessElse:
  Enabled: false

Style/FormatString:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Style/CommentAnnotation:
  Enabled: false

Style/MethodDefParentheses:
  Enabled: false

Style/ColonMethodCall:
  Enabled: false

Style/RescueModifier:
  Enabled: false

Style/Encoding:
  Enabled: false

Style/RedundantRegexpEscape:
  Enabled: false

Style/SlicingWithRange:
  Enabled: false

Style/RedundantSelf:
  Enabled: false

# Layout preferences
Layout/IndentationWidth:
  Enabled: false

Layout/IndentationConsistency:
  Enabled: false

Layout/ElseAlignment:
  Enabled: false

Layout/EndAlignment:
  Enabled: false

Layout/EmptyLinesAroundExceptionHandlingKeywords:
  Enabled: false

Layout/SpaceInsideBlockBraces:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/EmptyLinesAroundBlockBody:
  Enabled: false

Layout/HashAlignment:
  Enabled: false

Layout/SpaceBeforeBlockBraces:
  Enabled: false

Layout/SpaceAroundEqualsInParameterDefault:
  Enabled: false

Layout/EmptyLines:
  Enabled: false

Layout/TrailingEmptyLines:
  Enabled: false

Layout/EmptyLinesAroundModuleBody:
  Enabled: false

Layout/SpaceInsideArrayLiteralBrackets:
  Enabled: false

Layout/EmptyLinesAroundClassBody:
  Enabled: false

Layout/SpaceInsidePercentLiteralDelimiters:
  Enabled: false

Layout/EmptyLineAfterMagicComment:
  Enabled: false

Layout/DotPosition:
  Enabled: false

Layout/SpaceAfterComma:
  Enabled: false

Layout/EmptyLineBetweenDefs:
  Enabled: false

Layout/LineLength:
  Enabled: false

# Lint warnings to keep code safe but allow flexibility
Lint/AmbiguousRegexpLiteral:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: false

Lint/Void:
  Enabled: false

Lint/ConstantDefinitionInBlock:
  Enabled: false

Lint/AssignmentInCondition:
  Enabled: false

Lint/InheritException:
  Enabled: false

Lint/UselessAssignment:
  Enabled: false

Lint/NonAtomicFileOperation:
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: false

# Naming conventions
Naming/PredicateMethod:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Naming/RescuedExceptionsVariableName:
  Enabled: false

Naming/ConstantName:
  Enabled: false

# Security checks (important but legacy code uses patterns)
Security/Open:
  Enabled: false

